<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>A股盯盘助手</title>
<link rel="manifest" href="manifest.json">
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f5f5; color:#222; }
  header { background:#c62828; color:#fff; padding:16px 16px 14px; }
  header h1 { font-size:18px; margin:0 0 4px; font-weight:500; }
  header p { font-size:12px; margin:0; opacity:.85; }
  main { padding:12px; }
  .card { background:#fff; border-radius:10px; padding:14px; margin-bottom:12px; }
  .nums { display:flex; gap:12px; }
  .numbox { flex:1; background:#fafafa; border-radius:8px; padding:12px; }
  .numbox .label { font-size:12px; color:#777; }
  .numbox .value { font-size:30px; font-weight:500; margin:2px 0; }
  .numbox .delta { font-size:11px; color:#888; }
  .zt { color:#c62828; } .zb { color:#ef6c00; }
  .row { display:flex; align-items:center; padding:9px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }
  .row:last-child { border-bottom:none; }
  .row .time { width:48px; color:#555; }
  .row .info { flex:1; }
  .row .delta { font-size:12px; }
  .row.waiting { color:#aaa; }
  .row.clickable { cursor:pointer; }
  /* 柱状图 */
  .chead { display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:500; margin-bottom:12px; }
  .cdone { font-size:12px; color:#999; font-weight:400; }
  .cseg-label { font-size:12px; color:#999; margin:10px 0 4px; }
  .cbar-row { display:flex; align-items:flex-end; height:96px; }
  .cbar-col { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; }
  .cbar-val { font-size:10px; color:#c62828; height:14px; line-height:14px; }
  .cbar-track { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; }
  .cbar { width:70%; max-width:14px; background:#e57373; border-radius:2px 2px 0 0; min-height:2px; }
  .cbar-col:has(.cbar-val) { }
  .cbar-time { font-size:8px; color:#aaa; height:12px; line-height:12px; white-space:nowrap; transform:scale(.9); }
  .dbadge.phase { background:rgba(255,255,255,.22); }
  .row.clickable:active { background:#fafafa; }
  .arrow { color:#bbb; font-size:14px; margin-left:6px; }
  button { background:#c62828; color:#fff; border:none; border-radius:8px; padding:10px 14px; font-size:14px; width:100%; }
  button:disabled { background:#bbb; }
  .tip { font-size:11px; color:#999; line-height:1.6; padding:0 4px 20px; }
  #msg { font-size:12px; color:#777; margin-top:8px; min-height:16px; }
  #summaryCard { cursor:pointer; }
  /* 详情弹层 */
  #detailMask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none; }
  #detailMask.show { display:block; }
  #detailPanel { position:absolute; left:0; right:0; bottom:0; top:56px; background:#f7f7f7; border-radius:16px 16px 0 0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .dhead { background:#c62828; color:#fff; padding:18px 16px; border-radius:16px 16px 0 0; position:sticky; top:0; }
  .dhead .dtitle { font-size:22px; font-weight:600; }
  .dhead .dbadge { display:inline-block; font-size:11px; background:rgba(255,255,255,.22); padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }
  .dhead .dsub { font-size:12px; opacity:.85; margin-top:6px; }
  .dstat { display:flex; gap:0; padding:14px 16px; background:#c62828; color:#fff; }
  .dstat > div { flex:1; text-align:center; }
  .dstat .v { font-size:20px; font-weight:600; }
  .dstat .k { font-size:11px; opacity:.85; margin-top:2px; }
  .dbody { margin:12px; background:#fff; border-radius:10px; padding:16px; font-size:14px; line-height:1.9; color:#333; }
  .dbody h3 { font-size:14px; margin:16px 0 6px; color:#111; }
  .dbody h3:first-child { margin-top:0; }
  .dbody ol { margin:0; padding-left:22px; }
  .dbody li { padding-left:2px; }
  .dbody .none { color:#999; }
  .dbody .muted { color:#777; font-size:13px; }
  .dbody .sector-list > div { padding:2px 0; }
  .dbody b { color:#c62828; font-weight:600; }
  .dclose { position:absolute; top:14px; right:16px; color:#fff; font-size:22px; line-height:1; cursor:pointer; z-index:2; }
  .mem { font-size:11px; color:#aaa; padding:0 16px 24px; }
</style>
</head>
<body>
<header>
  <h1>A股盯盘助手</h1>
  <p>涨停 / 炸板 25 节点 · 自动回填当日已完成节点</p>
</header>
<main>
  <div class="card">
    <button id="fetchBtn">立即回填当日节点</button>
    <div id="msg">页面打开时自动回填当日已完成节点，停留期间每 2 分钟更新一次</div>
  </div>
  <div class="card" id="summaryCard">
    <div id="dateLabel" style="font-size:12px;color:#777;margin-bottom:10px;">今日</div>
    <div class="nums">
      <div class="numbox"><div class="label">涨停家数</div><div class="value zt" id="zt">—</div><div class="delta" id="ztDelta"></div></div>
      <div class="numbox"><div class="label">炸板家数</div><div class="value zb" id="zb">—</div><div class="delta" id="zbDelta"></div></div>
    </div>
    <div id="sector" style="font-size:12px;color:#666;margin-top:10px;"></div>
  </div>
  <div class="card" id="chart"></div>
  <div class="card"><div id="timeline"></div></div>
  <p class="tip">数据来自东方财富公开接口，按首次封板时间回推当日已完成节点，早期节点为近似值。点任意有数据的节点查看明细：涨停前 5、连板前 5、个股所属板块、节点增量与炸板。本网页版需在页面打开时回填，关闭后不后台更新；「添加到主屏幕」可获得独立图标。</p>
</main>

<div id="detailMask">
  <div id="detailPanel">
    <div class="dhead">
      <span class="dclose" id="dclose">×</span>
      <div><span class="dtitle" id="dtitle">10:40</span><span class="dbadge" id="dbadge">实时快照</span></div>
      <div class="dsub" id="dsub">11月19日 周四</div>
    </div>
    <div class="dstat">
      <div><div class="v" id="dzt">—</div><div class="k">涨停</div></div>
      <div><div class="v" id="dzb">—</div><div class="k">炸板</div></div>
      <div><div class="v" id="drate">—</div><div class="k">炸板率</div></div>
      <div><div class="v" id="dtop">—</div><div class="k">增量最多板块</div></div>
    </div>
    <div class="dbody" id="dbody"></div>
    <div class="mem">数据来源：东方财富公开行情接口 · 仅供参考，不构成投资建议</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
